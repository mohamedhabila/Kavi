name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        # Pinned from actions/checkout@v7.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # Pinned from actions/setup-node@v6.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Install dependencies
        run: npm ci

      - name: Run contributor verification gate
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Annotate failing suites
        # Job logs need repository auth to read; check-run annotations do not.
        # Surface the failing Jest suites and tests so a red check names its
        # cause on the run page and through the API for every contributor.
        if: failure()
        shell: bash
        run: node scripts/ci/annotate-verify-failures.js verify.log
